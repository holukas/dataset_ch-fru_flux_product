<!--
  The sidebar brand: the site mark beside the name, on one line, with the site code in bold.

  Quarto's sidebar title is plain text, so this script replaces the title link's text with an
  inline copy of logo.svg and the wordmark. The mark carries its own dark tile, so it reads on
  both the light and the dark theme and needs no theme variable. The clipPath id is renamed to
  site-brand-tile so that it cannot collide with another id on the page.

  The inline SVG is a hand-made copy of docs/logo.svg and is not generated by
  _raw/render_mark.py: keep it in sync with logo.svg whenever the drawing changes.
-->
<style>
  .site-brand {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    text-decoration: none;
  }
  .site-brand svg {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
  }
  .site-brand > span { white-space: nowrap; font-size: 0.85em; }
  .site-brand .site-brand-bold { font-weight: 700; }
  .site-brand .site-brand-normal { font-weight: 400; }
</style>
<script>
(function () {
  var link = document.querySelector("#quarto-sidebar .sidebar-title > a");
  if (!link) return;
  link.classList.add("site-brand");
  link.setAttribute("aria-label", "CH-FRU Flux Product, home");
  link.innerHTML =
    '<svg viewBox="0 0 256 256" aria-hidden="true">' +
    '<defs><clipPath id="site-brand-tile"><rect width="256" height="256" rx="46"/></clipPath></defs>' +
    '<rect width="256" height="256" rx="46" fill="#163a5c"/>' +
    '<g clip-path="url(#site-brand-tile)">' +
    '<circle cx="188" cy="70" r="26" fill="#ffd166"/>' +
    '<polygon points="0,156 40,128 70,140 112,110 156,138 196,122 256,150 256,256 0,256" fill="#2e6390"/>' +
    '<circle cx="30" cy="400" r="240" fill="#4f9e4a"/>' +
    '<circle cx="240" cy="420" r="236" fill="#7cc65c"/>' +
    '<g fill="#e6f8c8">' +
    '<polygon points="104,256 104,214 100,170 88,124 108,168 116,212 118,256"/>' +
    '<polygon points="122,256 124,196 126,140 134,80 140,140 138,198 138,256"/>' +
    '<polygon points="142,256 144,210 154,166 178,128 162,172 156,212 156,256"/>' +
    '<polygon points="84,256 86,226 80,198 62,170 88,194 96,226 96,256"/>' +
    '<polygon points="160,256 164,226 176,202 198,182 182,210 174,230 172,256"/>' +
    '</g>' +
    '</g>' +
    '</svg>' +
    '<span><span class="site-brand-bold">CH-FRU</span> <span class="site-brand-normal">flux product</span></span>';
})();
</script>
